<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sider Chat</title>
<style>
  :root{
    --bg:#f7f5f1; --surface:#ffffff; --surface2:#efece6; --text:#23211d; --muted:#7a756b;
    --border:#e5e1d8; --accent:#e8613c; --accent2:#7c5cd6; --shadow:0 8px 30px rgba(60,50,30,.08);
    --bubble:#f0ece3; --danger:#c0392b; --dangerbg:#fdecea; --ok:#2e9e5b;
  }
  html[data-theme="dark"]{
    --bg:#171613; --surface:#201f1c; --surface2:#2a2925; --text:#ece9e2; --muted:#a39d92;
    --border:#35332d; --bubble:#2c2b27; --shadow:0 8px 30px rgba(0,0,0,.35); --dangerbg:#3d2320;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit}

  /* ---------- Sidebar ---------- */
  #sidebar{width:284px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 14px;gap:14px;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
  .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;box-shadow:var(--shadow)}
  .brand h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  .brand small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
  #newChatBtn{width:100%;padding:11px;border:0;border-radius:999px;background:var(--text);color:var(--bg);font-size:14px;font-weight:600;transition:opacity .15s}
  #newChatBtn:hover{opacity:.85}
  #chatList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
  .chatItem{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;font-size:13.5px;color:var(--text);cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
  .chatItem:hover{background:var(--surface2)}
  .chatItem.active{background:var(--surface2);font-weight:600}
  .chatItem .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chatItem .del{color:var(--muted);background:none;border:0;font-size:15px;padding:0 2px;opacity:0}
  .chatItem:hover .del{opacity:1}
  .sideLabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 6px}
  .settings{background:var(--bg);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:9px}
  .settings label{font-size:11.5px;color:var(--muted);font-weight:600}
  .settings input,.settings select{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13.5px;outline:none}
  .settings input:focus,.settings select:focus{border-color:var(--accent)}
  .rowBtns{display:flex;gap:8px;align-items:center}
  .pill{flex:1;padding:8px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:550}
  .pill:hover{background:var(--surface2)}
  .dot{width:9px;height:9px;border-radius:50%;background:#c9c4b8;flex-shrink:0}
  .dot.ok{background:var(--ok)} .dot.err{background:#e0483e}
  #statusText{font-size:12px;color:var(--muted)}
  details sys{display:block}
  details summary{font-size:12.5px;color:var(--muted);cursor:pointer;font-weight:550}
  details textarea{width:100%;margin-top:8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:13px;resize:vertical}
  #themeBtn{align-self:flex-start;background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px}

  /* ---------- Main ---------- */
  #main{flex:1;display:flex;flex-direction:column;min-width:0}
  #topbar{display:none;align-items:center;gap:10px;padding:12px 16px}
  #menuBtn{background:var(--surface);border:1px solid var(--border);border-radius:10px;width:38px;height:38px;font-size:17px;color:var(--text)}
  #scroll{flex:1;overflow-y:auto}
  .col{max-width:768px;margin:0 auto;padding:10px 20px 24px;display:flex;flex-direction:column}
  #welcome{margin:auto;text-align:center;padding:48px 10px}
  #welcome .bigLogo{width:60px;height:60px;border-radius:20px;margin:0 auto 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:var(--shadow)}
  #welcome h2{font-size:30px;font-weight:650;letter-spacing:-.02em;margin:0 0 8px}
  #welcome p{color:var(--muted);margin:0 0 26px;font-size:15px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13.5px;color:var(--text);transition:all .15s}
  .chip:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow)}
  .msgRow{display:flex;gap:12px;margin:14px 0;width:100%}
  .msgRow.user{justify-content:flex-end}
  .avatar{width:30px;height:30px;border-radius:10px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px}
  .bubble{max-width:85%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
  .msgRow.user .bubble{background:var(--bubble);border-bottom-right-radius:8px}
  .msgRow.assistant .bubble{background:transparent;padding-left:2px;max-width:100%}
  .bubble code{background:var(--surface2);padding:1px 6px;border-radius:6px;font-size:13.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .bubble pre{background:#23211d;color:#f2efe9;padding:14px;border-radius:14px;overflow-x:auto;white-space:pre}
  .bubble pre code{background:transparent;padding:0;color:inherit}
  .msgRow.error .bubble{background:var(--dangerbg);color:var(--danger)}
  .typing{display:inline-flex;gap:5px;padding:6px 2px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- Composer ---------- */
  #composerWrap{padding:8px 20px 18px}
  .composerCol{max-width:768px;margin:0 auto}
  #composer{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);display:flex;align-items:flex-end;gap:8px;padding:10px 10px 10px 18px}
  #input{flex:1;border:0;outline:none;resize:none;background:transparent;color:var(--text);font-size:15.5px;line-height:1.5;max-height:160px;padding:6px 0}
  #input::placeholder{color:var(--muted)}
  #sendBtn{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:17px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:transform .12s,opacity .12s}
  #sendBtn:hover{transform:scale(1.06)} #sendBtn:disabled{opacity:.4;transform:none;cursor:default}
  .hint{text-align:center;color:var(--muted);font-size:11.5px;margin-top:9px}

  #scrim{display:none}
  @media (max-width:760px){
    #sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-105%);transition:transform .25s ease;box-shadow:var(--shadow)}
    body.navOpen #sidebar{transform:none}
    body.navOpen #scrim{display:block;position:fixed;inset:0;background:rgba(20,18,15,.35);z-index:10}
    #topbar{display:flex}
    .bubble{max-width:92%}
    #welcome h2{font-size:24px}
  }
</style>
</head>
<body>
<div id="scrim"></div>

<aside id="sidebar">
  <div class="brand">
    <div class="logo">✦</div>
    <h1>Sider Chat<small>Chat with Sider AI models</small></h1>
  </div>

  <button id="newChatBtn" type="button">+ New chat</button>

  <div>
    <div class="sideLabel" style="margin-bottom:6px">Your chats</div>
    <div id="chatList"></div>
  </div>

  <div class="settings">
    <div>
      <label for="apikey">Sider API key</label>
      <input id="apikey" type="password" placeholder="Paste your API key" autocomplete="off" style="margin-top:5px">
    </div>
    <div>
      <label for="model">Model</label>
      <select id="model" style="margin-top:5px">
        <option value="deepseek-4.1-unrestricted" selected>deepseek-4.1-unrestricted</option>
        <option value="gemini-3.1-pro">gemini-3.1-pro</option>
        <option value="gemini-3.8-flash">gemini-3.8-flash</option>
        <option value="glm-5.3-unrestricted">glm-5.3-unrestricted</option>
      </select>
    </div>
    <details>
      <summary>System prompt (optional)</summary>
      <textarea id="system" rows="2" placeholder="You are a helpful assistant."></textarea>
    </details>
    <div class="rowBtns">
      <button id="testBtn" class="pill" type="button">Test connection</button>
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Not tested</span>
    </div>
  </div>

  <button id="themeBtn" type="button">🌙 Dark mode</button>
</aside>

<div id="main">
  <div id="topbar">
    <button id="menuBtn" type="button">☰</button>
    <div class="logo" style="width:30px;height:30px;border-radius:9px;font-size:15px">✦</div>
    <strong style="font-size:15.5px">Sider Chat</strong>
  </div>

  <div id="scroll">
    <div class="col" id="thread"></div>
  </div>

  <div id="composerWrap">
    <div class="composerCol">
      <div id="composer">
        <textarea id="input" rows="1" placeholder="Message Sider Chat…"></textarea>
        <button id="sendBtn" type="button" title="Send">↑</button>
      </div>
      <div class="hint">Sider can make mistakes. Your key stays in your browser — requests go through this site's small proxy because Sider blocks direct browser calls.</div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const thread = $('thread'), inputEl = $('input'), keyEl = $('apikey'),
      modelEl = $('model'), sysEl = $('system'), statusText = $('statusText'),
      statusDot = $('statusDot'), chatListEl = $('chatList'), scrollEl = $('scroll');

/* ---------- Theme ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; localStorage.setItem('sider_theme', t);
  $('themeBtn').textContent = t === 'dark' ? '☀️ Light mode' : '🌙 Dark mode'; }
setTheme(localStorage.getItem('sider_theme') || 'light');
$('themeBtn').addEventListener('click', () =>
  setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'));

/* ---------- State: multiple saved chats ---------- */
let chats = JSON.parse(localStorage.getItem('sider_chats_v2') || '[]');
let activeId = localStorage.getItem('sider_active_chat') || null;
function saveChats(){ localStorage.setItem('sider_chats_v2', JSON.stringify(chats));
  localStorage.setItem('sider_active_chat', activeId || ''); }
function activeChat(){ return chats.find(c => c.id === activeId) || null; }
function newChat(){
  const c = { id: Date.now().toString(36), title: 'New chat', messages: [] };
  chats.unshift(c); activeId = c.id; saveChats(); renderList(); renderThread();
}
function renderList(){
  chatListEl.innerHTML = '';
  if (!chats.length){ chatListEl.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:4px 8px">No chats yet</div>'; return; }
  chats.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chatItem' + (c.id === activeId ? ' active' : '');
    const t = document.createElement('span'); t.className = 't'; t.textContent = c.title;
    const d = document.createElement('span'); d.className = 'del'; d.textContent = '×'; d.title = 'Delete chat';
    d.addEventListener('click', e => { e.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      if (activeId === c.id) activeId = chats.length ? chats[0].id : null;
      saveChats(); renderList(); renderThread(); });
    b.append(t, d);
    b.addEventListener('click', () => { activeId = c.id; saveChats(); renderList(); renderThread();
      document.body.classList.remove('navOpen'); });
    chatListEl.appendChild(b);
  });
}

/* ---------- Message rendering (tiny safe markdown) ---------- */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderText(text){
  const blocks = [];
  let s = esc(text).replace(/```(\w*)\n?([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push('<pre><code>' + code.replace(/\n$/,'') + '</code></pre>');
    return '\u0001' + (blocks.length - 1) + '\u0002';
  });
  s = s.replace(/`([^`\n]+)`/g, '<code>$1</code>')
       .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return s.replace(/\u0001(\d+)\u0002/g, (m, i) => blocks[+i]);
}
function bubbleRow(role, text, cls){
  const row = document.createElement('div');
  row.className = 'msgRow ' + (cls || role);
  if (role === 'assistant' && !cls){
    const a = document.createElement('div'); a.className = 'avatar'; a.textContent = '✦'; row.appendChild(a);
  }
  const b = document.createElement('div'); b.className = 'bubble';
  b.innerHTML = renderText(text);
  row.appendChild(b); thread.appendChild(row);
  scrollEl.scrollTop = scrollEl.scrollHeight;
  return b;
}
function showWelcome(){
  const c = activeChat();
  if (c && c.messages.length) return;
  const w = document.createElement('div'); w.id = 'welcome';
  w.innerHTML = '<div class="bigLogo">✦</div><h2>How can I help today?</h2>' +
    '<p>Pick a model on the left, paste your Sider key once, and start chatting.</p>';
  const chips = document.createElement('div'); chips.className = 'chips';
  ['Write a short story about Kashmir in winter', 'Explain quantum computing in simple words',
   'Write a Python function to sort a list', 'Give me 5 ideas for a photo series']
    .forEach(p => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = p;
      b.addEventListener('click', () => { inputEl.value = p; send(); }); chips.appendChild(b); });
  w.appendChild(chips); thread.appendChild(w);
}
function renderThread(){
  thread.innerHTML = '';
  const c = activeChat();
  if (c) c.messages.forEach(m => bubbleRow(m.role, m.content));
  showWelcome();
}

/* ---------- API (through this site's proxy: /api/models, /api/chat) ---------- */
keyEl.value = localStorage.getItem('sider_api_key') || '';
keyEl.addEventListener('change', () => localStorage.setItem('sider_api_key', keyEl.value.trim()));
modelEl.value = localStorage.getItem('sider_model') || 'deepseek-4.1-unrestricted';
modelEl.addEventListener('change', () => localStorage.setItem('sider_model', modelEl.value));
function headers(){ return {'Content-Type':'application/json','Authorization':'Bearer ' + keyEl.value.trim()}; }
function setStatus(text, cls){ statusText.textContent = text; statusDot.className = 'dot' + (cls ? ' ' + cls : ''); }
function friendlyError(status, body){
  if (status === 401 || status === 403) return 'Your API key was rejected by Sider. Check the key and try again.';
  if (status === 429) return 'Sider rate limit hit. Wait a bit and try again.';
  if (status === 502 || status === 504) return 'Sider took too long to respond (gateway timeout). Try again, or ask for a shorter answer.';
  return (body && body.error && body.error.message) || ('Request failed (' + status + ')');
}
const PROXY_HINT = 'Could not reach the proxy. Run server.py locally or open the deployed (Vercel / Muse) version of this site.';

async function testConnection(){
  if (!keyEl.value.trim()){ setStatus('Paste your key first', 'err'); return; }
  setStatus('Testing…');
  try{
    const res = await fetch('/api/models', {headers: headers()});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(friendlyError(res.status, data));
    const ids = (data.data || []).map(m => m.id);
    if (ids.length){
      const cur = modelEl.value; modelEl.innerHTML = '';
      ids.forEach(id => { const o = document.createElement('option'); o.value = id; o.textContent = id; modelEl.appendChild(o); });
      if (ids.includes(cur)) modelEl.value = cur;
    }
    setStatus('Connected', 'ok');
  }catch(e){ setStatus('Failed', 'err');
    bubbleRow('assistant', e.message.includes('Failed to fetch') ? PROXY_HINT : e.message, 'error'); }
}

async function send(){
  const text = inputEl.value.trim();
  if (!text) return;
  if (!keyEl.value.trim()){ setStatus('Paste your key first', 'err'); keyEl.focus(); return; }
  if (!activeChat()) newChat();
  const chat = activeChat();
  inputEl.value = ''; autoresize();
  const w = $('welcome'); if (w) w.remove();
  chat.messages.push({role:'user', content:text});
  if (chat.title === 'New chat') chat.title = text.slice(0, 42);
  saveChats(); renderList();
  bubbleRow('user', text);
  const btn = $('sendBtn'); btn.disabled = true;
  const typing = bubbleRow('assistant', '');
  typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
  try{
    const payload = [];
    if (sysEl.value.trim()) payload.push({role:'system', content: sysEl.value.trim()});
    payload.push(...chat.messages);
    const res = await fetch('/api/chat', {method:'POST', headers: headers(),
      body: JSON.stringify({model: modelEl.value, messages: payload})});
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(friendlyError(res.status, data));
    const reply = data.choices && data.choices[0] && data.choices[0].message
      ? data.choices[0].message.content : '(empty reply)';
    typing.innerHTML = renderText(reply);
    chat.messages.push({role:'assistant', content: reply});
    saveChats();
  }catch(e){
    typing.parentElement.className = 'msgRow error';
    typing.textContent = e.message.includes('Failed to fetch') ? PROXY_HINT : e.message;
    chat.messages.pop(); saveChats();
  }finally{ btn.disabled = false; scrollEl.scrollTop = scrollEl.scrollHeight; }
}

/* ---------- Composer behaviour ---------- */
function autoresize(){ inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px'; }
inputEl.addEventListener('input', autoresize);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
$('sendBtn').addEventListener('click', send);
$('testBtn').addEventListener('click', testConnection);
$('newChatBtn').addEventListener('click', () => { newChat(); document.body.classList.remove('navOpen'); inputEl.focus(); });
$('menuBtn').addEventListener('click', () => document.body.classList.add('navOpen'));
$('scrim').addEventListener('click', () => document.body.classList.remove('navOpen'));

if (!chats.length) newChat(); else { renderList(); renderThread(); }
</script>
</body>
</html>
